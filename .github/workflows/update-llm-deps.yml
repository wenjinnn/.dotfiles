name: Update Dependencies

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-deps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe182084b6f93bcd1d7c0b3c7a7c2c2f7b # v5.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Install source prefetch tools
        run: |
          nix profile install nixpkgs#nix-prefetch-github nixpkgs#nix-prefetch-git nixpkgs#prefetch-npm-deps
          command -v nix-prefetch-github nix-prefetch-git nix-prefetch-url nix-build prefetch-npm-deps

      - name: Check and update dependencies
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update-deps.py

      - name: Create Pull Request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ github.token }}
          branch: auto-update/deps
          delete-branch: true
          title: "chore: update GitHub dependencies"
          body: |
            Automated weekly update of pinned GitHub and npm dependencies
            (`modules/home-manager/llm/default.nix`,
            `modules/home-manager/de.nix`,
            `pkgs/pi-acp/package.nix`,
            `pkgs/pi-web/package.nix`).

            **Updated repos:** ${{ steps.check.outputs.repos }}

            ${{ steps.check.outputs.warnings && '**Warnings:**' || '' }}
            ${{ steps.check.outputs.warnings }}

            Please review the changes and merge if everything looks correct.
          commit-message: "chore: update GitHub dependency revs and hashes"
          labels: dependencies, automated
